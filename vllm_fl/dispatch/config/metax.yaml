# vLLM-FL Dispatch Configuration for METAX
# Auto-loaded when running on METAX GPU hardware

# Preferred default backend type: flagos, vendor, reference
prefer: flagos

# Strict Mode:
#   true  = Raise an error immediately on failure; do not attempt other backends.
#   false = Attempt the next available backend in sequence upon failure (Default).
strict: false

# Vendor Whitelist (Optional, allows all if not set)
# allow_vendors:
#  - metax

# Vendor Blacklist (Optional)
# deny_vendors:
#   - cuda

# Per-operator backend execution order (Optional)
# Only the backends listed here will be attempted, in the order specified.
#
# Supported tokens:
#   - flagos        : Default FlagOS implementation (Triton)
#   - reference     : PyTorch reference implementation
#   - vendor        : Any available vendor backend (auto-detected)
#   - vendor:metax   : METAX-specific vendor backend
op_backends:
  # attention_backend: prioritize vendor (MACA attention)
  attention_backend:
    - vendor:metax
  # All other ops: prefer FlagGems (Triton), fallback to reference (PyTorch native)
  silu_and_mul:
    - flagos
    - reference
  rms_norm:
    - flagos
    - reference
  rotary_embedding:
    - flagos
    - reference
  topk_softmax:
    - flagos
    - reference

# FlagOS operator whitelist
#
# Measured on MetaX C500 with MiniCPM5-2B (see experiments/FINDINGS.md sections
# 2.0 and 3.1). This is the single largest win found on this platform:
#
#   * The three fused ops below are genuinely faster as FlagGems Triton kernels.
#   * Everything else is faster on the native MACA implementation. In
#     particular `mm` on FlagGems was both slower AND triggered the runtime
#     Triton autotuner on the inference hot path, producing reproducible ~20 s
#     stalls whenever a new prefill token count was seen (prefill M values are
#     effectively continuous, so the autotune cache never warmed up).
#
# Official-case effect (4k, 256 x (4096+1024) at concurrency 64):
#   default (prefer all to FlagGems)  5271.99 tok/s, math_500 L3 accuracy 97.1%
#   this whitelist                    8797.67 tok/s, math_500 L3 accuracy 97.1%
#   -> +67% throughput at identical accuracy, zero 20 s stalls.
#
# Overridable by setting either VLLM_FL_FLAGOS_WHITELIST or
# VLLM_FL_FLAGOS_BLACKLIST, which take precedence over this default.
# Competition-safe default: no operator whitelist. Rely on FlagGems
# align32_geometric M-bucketing to bound mm autotune instead of restricting
# which ops may use FlagGems. Empty list => treated as unset (prefer: flagos).
flagos_whitelist: []

# FlagOS operator blacklist
flagos_blacklist:
  - masked_fill
  - masked_fill_

# OOT (Out-of-Tree) operator blacklist
oot_blacklist:
  - masked_fill
  - masked_fill_
